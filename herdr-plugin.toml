id = "local.yazi-links"
name = "Open file links in Yazi"
description = "Open file hyperlinks in Yazi; optional Herdr patch also recognizes plain-text paths."
version = "0.2.3"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

[[actions]]
id = "open"
title = "Open in Yazi"
command = ["python3", "open.py", "click"]

[[link_handlers]]
id = "files"
title = "Open file in Yazi"
pattern = "^file://"
action = "open"

[[panes]]
id = "yazi"
title = "Yazi"
placement = "split"
command = ["sh", "-c", 'exec python3 "$HERDR_PLUGIN_ROOT/open.py" run']
