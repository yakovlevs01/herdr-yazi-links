name: Release installation
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install from the public release on a fresh runner
        run: ./install.sh
      - name: Verify installed configuration and idempotence
        run: |
          ./install.sh --check
          ./install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify real patched Herdr and Yazi in a temporary session
        run: python3 scripts/smoke.py --herdr .build/bin/herdr --expect-paths
